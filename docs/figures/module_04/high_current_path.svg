<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 700" width="920" height="700" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <rect width="920" height="700" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c62828"/>
    </marker>
  </defs>

  <text x="460" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">Module 4 – Complete High-Current TEC Path</text>
  <text x="460" y="52" text-anchor="middle" font-size="13" fill="#444">Solid = high current, 18 AWG stranded copper · Dashed = low-current logic/signal</text>

  <!-- POWER SUPPLY -->
  <rect x="40" y="80" width="200" height="140" rx="6" fill="#f5f5f5" stroke="#111" stroke-width="2"/>
  <text x="140" y="108" text-anchor="middle" font-weight="bold">POWER SUPPLY</text>
  <text x="140" y="128" text-anchor="middle" font-size="13">12 V</text>
  <text x="140" y="146" text-anchor="middle" font-size="13">current limit 10 A</text>
  <text x="140" y="164" text-anchor="middle" font-size="12" fill="#555">(check label on side)</text>
  <text x="228" y="119" text-anchor="end" font-weight="bold" fill="#c62828">V+</text>
  <text x="228" y="199" text-anchor="end" font-weight="bold">V−</text>
  <circle cx="240" cy="115" r="5" fill="#c62828"/>
  <circle cx="240" cy="195" r="5" fill="#111"/>

  <!-- H-BRIDGE -->
  <rect x="380" y="80" width="220" height="160" rx="6" fill="#eef3fb" stroke="#111" stroke-width="2"/>
  <text x="490" y="108" text-anchor="middle" font-weight="bold">H-BRIDGE</text>
  <text x="490" y="126" text-anchor="middle" font-size="13">BTS7960</text>
  <text x="392" y="119" font-weight="bold" fill="#c62828">B+</text>
  <text x="392" y="199" font-weight="bold">B−</text>
  <text x="588" y="119" text-anchor="end" font-weight="bold">M+</text>
  <text x="588" y="199" text-anchor="end" font-weight="bold">M−</text>
  <circle cx="380" cy="115" r="5" fill="#c62828"/>
  <circle cx="380" cy="195" r="5" fill="#111"/>
  <circle cx="600" cy="115" r="5" fill="#111"/>
  <circle cx="600" cy="195" r="5" fill="#111"/>

  <!-- Supply to bridge -->
  <line x1="240" y1="115" x2="380" y2="115" stroke="#c62828" stroke-width="4"/>
  <line x1="240" y1="195" x2="380" y2="195" stroke="#111" stroke-width="4"/>
  <text x="310" y="106" text-anchor="middle" font-size="12" fill="#c62828">18 AWG (+)</text>
  <text x="310" y="186" text-anchor="middle" font-size="12">18 AWG (−)</text>
  <line x1="275" y1="135" x2="345" y2="135" stroke="#c62828" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="345" y1="215" x2="275" y2="215" stroke="#c62828" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- M+ to thermal switch -->
  <polyline points="600,115 820,115 820,262" fill="none" stroke="#6a1b9a" stroke-width="4"/>
  <text x="710" y="106" text-anchor="middle" font-size="12" fill="#6a1b9a">18 AWG</text>

  <!-- Thermal switch -->
  <rect x="806" y="262" width="28" height="16" rx="3" fill="#ffd54f" stroke="#111"/>
  <text x="800" y="275" text-anchor="end" font-size="12">spade crimp</text>
  <rect x="770" y="286" width="100" height="72" rx="6" fill="#fff8e1" stroke="#111" stroke-width="2"/>
  <circle cx="800" cy="322" r="4" fill="#111"/>
  <circle cx="840" cy="322" r="4" fill="#111"/>
  <line x1="800" y1="316" x2="840" y2="316" stroke="#111" stroke-width="2.5"/>
  <line x1="820" y1="278" x2="820" y2="286" stroke="#6a1b9a" stroke-width="4"/>
  <text x="820" y="302" text-anchor="middle" font-size="11" font-weight="bold">THERMAL SWITCH</text>
  <text x="820" y="344" text-anchor="middle" font-size="11">N.C., opens ≈ 65 °C</text>
  <line x1="820" y1="358" x2="820" y2="366" stroke="#6a1b9a" stroke-width="4"/>
  <rect x="806" y="366" width="28" height="16" rx="3" fill="#ffd54f" stroke="#111"/>
  <text x="800" y="379" text-anchor="end" font-size="12">spade crimp</text>
  <text x="764" y="330" text-anchor="end" font-size="12" font-weight="bold" fill="#6a1b9a">in SERIES</text>

  <!-- switch to TEC+ -->
  <line x1="820" y1="382" x2="820" y2="470" stroke="#6a1b9a" stroke-width="4"/>
  <text x="828" y="430" font-size="12" fill="#6a1b9a">18 AWG</text>

  <!-- M- to TEC- -->
  <polyline points="600,195 680,195 680,470" fill="none" stroke="#6a1b9a" stroke-width="4"/>
  <text x="688" y="240" font-size="12" fill="#6a1b9a">18 AWG</text>

  <!-- TEC -->
  <rect x="620" y="470" width="260" height="100" rx="6" fill="#e8f5e9" stroke="#111" stroke-width="2"/>
  <circle cx="680" cy="470" r="5" fill="#111"/>
  <circle cx="820" cy="470" r="5" fill="#111"/>
  <text x="680" y="492" text-anchor="middle" font-weight="bold">TEC−</text>
  <text x="820" y="492" text-anchor="middle" font-weight="bold">TEC+</text>
  <text x="750" y="522" text-anchor="middle" font-weight="bold">TEC (Peltier)</text>
  <text x="750" y="542" text-anchor="middle" font-size="12">on heat exchanger · thermistor on plate</text>
  <text x="750" y="560" text-anchor="middle" font-size="12">current reverses: HEAT vs COOL</text>

  <!-- Heat exchanger branch -->
  <line x1="120" y1="220" x2="120" y2="470" stroke="#c62828" stroke-width="2.5"/>
  <line x1="170" y1="220" x2="170" y2="470" stroke="#111" stroke-width="2.5"/>
  <text x="112" y="350" text-anchor="end" font-size="12" fill="#c62828">+12 V</text>
  <text x="178" y="350" font-size="12">GND</text>
  <rect x="40" y="470" width="200" height="80" rx="6" fill="#f5f5f5" stroke="#111" stroke-width="2"/>
  <text x="140" y="498" text-anchor="middle" font-weight="bold">HEAT EXCHANGER</text>
  <text x="140" y="518" text-anchor="middle" font-size="12">pump + fans, direct from 12 V</text>
  <text x="140" y="536" text-anchor="middle" font-size="12">(not through H-bridge)</text>

  <!-- ARDUINO -->
  <rect x="380" y="330" width="220" height="110" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="490" y="356" text-anchor="middle" font-weight="bold" fill="#1565c0">ARDUINO UNO</text>
  <text x="490" y="376" text-anchor="middle" font-size="12" fill="#1565c0">pins 9, 10 → H-bridge inputs</text>
  <text x="490" y="394" text-anchor="middle" font-size="12" fill="#1565c0">GND shared with H-bridge</text>
  <text x="490" y="412" text-anchor="middle" font-size="12" fill="#1565c0">A0 ← thermistor divider</text>
  <line x1="450" y1="330" x2="450" y2="240" stroke="#1565c0" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="490" y1="330" x2="490" y2="240" stroke="#1565c0" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="530" y1="330" x2="530" y2="240" stroke="#1565c0" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="446" y="290" text-anchor="end" font-size="11" fill="#1565c0">pin 9</text>
  <text x="494" y="270" font-size="11" fill="#1565c0">pin 10</text>
  <text x="534" y="300" font-size="11" fill="#1565c0">GND/EN</text>
  <polyline points="600,420 640,420 640,470" fill="none" stroke="#1565c0" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="604" y="455" font-size="11" fill="#1565c0">A0</text>

  <!-- Loop summary -->
  <rect x="40" y="590" width="840" height="92" rx="6" fill="#fafafa" stroke="#999"/>
  <text x="56" y="614" font-weight="bold">Current loop:</text>
  <text x="160" y="614" font-size="13">V+ → B+ → [H-bridge] → M+ → spade → thermal switch → spade → TEC+ → TEC− → M− → [H-bridge] → B− → V−</text>
  <text x="56" y="638">Opening the thermal switch breaks the only path to the TEC, so it stops TEC current no matter what the Arduino does.</text>
  <text x="56" y="662">5 high-current wires, all 18 AWG stranded Cu: V+–B+, V−–B−, M+–switch, switch–TEC+, M−–TEC−</text>
</svg>
